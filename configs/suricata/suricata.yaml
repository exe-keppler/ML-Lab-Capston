%YAML 1.1
---
# ═══════════════════════════════════════════════════════════════
# Suricata 7.x — Configuración empresarial para IDS-ML Lab UDLA
#
# Objetivos de este archivo:
#   - Reemplazar la config default con tuning explícito, no valores implícitos.
#   - Logs estructurados (eve.json con 14 tipos de eventos).
#   - Threading en modo workers con AF_PACKET tpacket-v3 + mmap.
#   - Offload de TCP checksums desactivado (protege contra truncamientos).
#   - File extraction + stats + anomaly para enriquecimiento del SIEM.
# ═══════════════════════════════════════════════════════════════

# ── 1. Vars (HOME_NET = red Docker del lab) ────────────────────
vars:
  address-groups:
    HOME_NET: "[172.25.0.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"

  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: "1521"
    SSH_PORTS: "22"
    DNP3_PORTS: "20000"
    MODBUS_PORTS: "502"
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: "21"
    GENEVE_PORTS: "6081"
    VXLAN_PORTS: "4789"
    TEREDO_PORTS: "3544"

# ── 2. Default paths ───────────────────────────────────────────
default-log-dir: /var/log/suricata/
stats:
  enabled: yes
  interval: 30
  decoder-events: true
  decoder-events-prefix: "decoder.event"
  stream-events: false

# ── 3. Outputs ─────────────────────────────────────────────────
outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: yes

  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      rotate-interval: day
      types:
        - alert:
            tagged-packets: yes
            metadata: yes
            xff:
              enabled: yes
              mode: extra-data
              deployment: reverse
              header: X-Forwarded-For
        - anomaly:
            enabled: yes
            types:
              decode: yes
              stream: yes
              applayer: yes
        - http:
            extended: yes
            dump-all-headers: both
        - dns:
            enabled: yes
            query: yes
            answer: yes
        - tls:
            extended: yes
        - files:
            force-magic: yes
        - smtp:
        - ftp
        - flow
        - netflow
        - ssh
        - stats:
            totals: yes
            threads: no
            deltas: yes

  - stats:
      enabled: yes
      filename: stats.log
      append: yes
      totals: yes

# ── 4. Logging interno ─────────────────────────────────────────
logging:
  default-log-level: notice
  default-output-filter:
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        level: info
        filename: suricata.log

# ── 5. AF-Packet — interfaz pasada con -i (enterprise tuning)
# 'default' aplica a cualquier interface que reciba el flag -i,
# así no hace falta hardcodear el bridge ID por host.
af-packet:
  - interface: default
    # threads: usar todos los cores disponibles (workers mode)
    threads: auto
    # cluster-type: flow hashing
    cluster-id: 99
    cluster-type: cluster_flow
    # defrag en kernel
    defrag: yes
    # mmap para zero-copy
    use-mmap: yes
    # mmap-locked requiere ulimit memlock alto; en lab lo dejamos off
    mmap-locked: no
    # tpacket-v3 (mejor perf en NICs modernos)
    tpacket-v3: yes
    # ring size afín al lab (4k frames × ~1500 bytes ≈ 6 MB buffer)
    ring-size: 4096
    # buffer-size por thread
    buffer-size: 65536
    # disable offload en interface (stream reassembly precisa)
    disable-promisc: no
    # Docker hace TCP offload → checksums vienen con valor 0 en captura
    # Ignorar para evitar 80% de ruido "SURICATA TCPv4 invalid checksum"
    checksum-checks: no
    # Failure mode
    use-emergency-flush: yes
    # Copy mode (for inline IPS)
    # copy-mode: ips
    # copy-iface: <interface>


# ── 6. App-layer parsers (completo) ────────────────────────────
app-layer:
  protocols:
    rfb:
      enabled: yes
      detection-ports:
        dp: 5900, 5901, 5902, 5903, 5904, 5905, 5906
    mqtt:
      enabled: yes
    krb5:
      enabled: yes
    bittorrent-dht:
      enabled: no
    snmp:
      enabled: yes
    ikev2:
      enabled: yes
    tls:
      enabled: yes
      detection-ports:
        dp: 443
      ja3-fingerprints: yes
      encryption-handling: default
    dcerpc:
      enabled: yes
    ftp:
      enabled: yes
    rdp:
      enabled: yes
    ssh:
      enabled: yes
    http2:
      enabled: yes
    smtp:
      enabled: yes
      raw-extraction: no
      mime:
        decode-mime: yes
        decode-base64: yes
        decode-quoted-printable: yes
        header-value-depth: 2000
        extract-urls: yes
        body-md5: no
      inspected-tracker:
        content-limit: 100000
        content-inspect-min-size: 32768
        content-inspect-window: 4096
    imap:
      enabled: detection-only
    smb:
      enabled: yes
      detection-ports:
        dp: 139, 445
    nfs:
      enabled: yes
    tftp:
      enabled: yes
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 100kb
          response-body-limit: 100kb
          request-body-minimal-inspect-size: 32kb
          request-body-inspect-window: 4kb
          response-body-minimal-inspect-size: 40kb
          response-body-inspect-window: 16kb
          response-body-decompress-layer-limit: 2
          http-body-inline: auto
          swf-decompression:
            enabled: yes
            type: both
            compress-depth: 100kb
            decompress-depth: 100kb
          double-decode-path: no
          double-decode-query: no
        server-config:

# ── 7. Stream engine — configuración empresarial ───────────────
stream:
  memcap: 256mb
  checksum-validation: yes
  inline: auto
  reassembly:
    memcap: 256mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes

# ── 8. Flow engine ─────────────────────────────────────────────
flow:
  memcap: 128mb
  hash-size: 65536
  prealloc: 10000
  emergency-recovery: 30

# ── 9. Detect engine (performance vs. accuracy) ────────────────
detect:
  profile: medium
  custom-values:
    toclient-groups: 3
    toserver-groups: 25
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000

# ── 10. MPM (Multi-Pattern Matcher) ────────────────────────────
mpm-algo: auto
spm-algo: auto

# ── 11. Threading ──────────────────────────────────────────────
threading:
  set-cpu-affinity: no
  cpu-affinity:
    - management-cpu-set:
        cpu: [ 0 ]
    - receive-cpu-set:
        cpu: [ 0 ]
    - worker-cpu-set:
        cpu: [ "all" ]
        mode: "exclusive"
        prio:
          default: "high"
  detect-thread-ratio: 1.0

# ── 12. Rules ──────────────────────────────────────────────────
default-rule-path: /var/lib/suricata/rules
rule-files:
  - suricata.rules

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config
threshold-file: /etc/suricata/threshold.config

# ── 13. Host table ─────────────────────────────────────────────
host:
  hash-size: 4096
  prealloc: 1000
  memcap: 32mb

# ── 14. Unix socket (control plane) ────────────────────────────
unix-command:
  enabled: yes
  filename: /var/run/suricata/suricata-command.socket

# ── 15. Legacy events ──────────────────────────────────────────
legacy:
  uricontent: enabled

# ── 16. Engine analysis ────────────────────────────────────────
engine-analysis:
  rules-fast-pattern: yes
  rules: yes

# ── 17. PCRE limits ────────────────────────────────────────────
pcre:
  match-limit: 3500
  match-limit-recursion: 1500

# ── 18. Host OS policy ─────────────────────────────────────────
host-os-policy:
  windows: [0.0.0.0/0]
  bsd: []
  bsd-right: []
  old-linux: []
  linux: []
  old-solaris: []
  solaris: []
  hpux10: []
  hpux11: []
  irix: []
  macos: []
  vista: []
  windows2k3: []

# ── 19. Decoder (protocol decode) ──────────────────────────────
decoder:
  teredo:
    enabled: true
    ports: $TEREDO_PORTS
  vxlan:
    enabled: true
    ports: $VXLAN_PORTS
  vntag:
    enabled: false
  geneve:
    enabled: true
    ports: $GENEVE_PORTS
