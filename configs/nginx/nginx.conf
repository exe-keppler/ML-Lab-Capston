worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    # Seguridad básica
    server_tokens off;
    client_max_body_size 10m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # DNS resolver de Docker. Sin esto, nginx cachea las IPs de los
    # upstreams al arrancar y queda con IPs stale si los containers
    # se recrean (causa típica de 502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        # Basic auth (htpasswd generado con htpasswd -Bc)
        auth_basic "IDS-ML Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # /health sin auth (probes)
        location = /health {
            auth_basic off;
            set $upstream_ml ml_api;
            proxy_pass http://$upstream_ml:8000/health;
        }

        # ML API
        location /api/ {
            set $upstream_ml ml_api;
            proxy_pass http://$upstream_ml:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Dashboard (Streamlit usa WebSocket)
        location / {
            set $upstream_dash dashboard;
            proxy_pass http://$upstream_dash:8501/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Jupyter
        location /lab/ {
            set $upstream_jup jupyter;
            proxy_pass http://$upstream_jup:8888/lab/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
        location /api/kernels/ {
            auth_basic off;
            set $upstream_jup jupyter;
            proxy_pass http://$upstream_jup:8888/api/kernels/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
