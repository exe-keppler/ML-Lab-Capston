worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    # Seguridad básica
    server_tokens off;
    client_max_body_size 10m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Upstreams internos
    upstream ml_api   { server ml_api:8000; }
    upstream dashboard { server dashboard:8501; }
    upstream jupyter   { server jupyter:8888; }

    server {
        listen 8080;
        server_name _;

        # Basic auth (htpasswd generado con htpasswd -Bc)
        auth_basic "IDS-ML Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # /health sin auth (probes)
        location = /health {
            auth_basic off;
            proxy_pass http://ml_api/health;
        }

        # ML API
        location /api/ {
            proxy_pass http://ml_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Dashboard (Streamlit usa WebSocket)
        location / {
            proxy_pass http://dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Jupyter
        location /lab/ {
            proxy_pass http://jupyter/lab/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
        location /api/kernels/ {
            auth_basic off;
            proxy_pass http://jupyter/api/kernels/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
